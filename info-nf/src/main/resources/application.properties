spring.application.name=info-nf
server.port=${SERVER_PORT:${DB_PORT:8080}}

# ===============================
# BANCO PADRÃO (DB2)
# ===============================
spring.datasource.url=${URL_DB2}
spring.datasource.username=${USERNAME_DB2}
spring.datasource.password=${PASSWORD_DB2}
spring.datasource.driver-class-name=com.ibm.db2.jcc.DB2Driver
spring.jpa.database-platform=org.hibernate.dialect.DB2Dialect
spring.jpa.hibernate.ddl-auto=none

# ===============================
# BANCO 1: DB2
# ===============================
spring.datasource.db2.jdbc-url=${URL_DB2}
spring.datasource.db2.url=${URL_DB2}
spring.datasource.db2.username=${USERNAME_DB2}
spring.datasource.db2.password=${PASSWORD_DB2}
spring.datasource.db2.driver-class-name=com.ibm.db2.jcc.DB2Driver

# ===============================
# BANCO 2: MySQL (Site / Promob)
# ===============================
spring.datasource.mysql.jdbc-url=${URL_MYSQL}
spring.datasource.mysql.url=${URL_MYSQL}
spring.datasource.mysql.username=${USERNAME_MYSQL}
spring.datasource.mysql.password=${PASSWORD_MYSQL}
spring.datasource.mysql.driver-class-name=com.mysql.cj.jdbc.Driver

# Variáveis do arquivo .env (lê na pasta atual ou na pasta pai)
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

auth.admin.user=${USERNAME_LOGIN}
auth.admin.password=${PASSWORD_LOGIN}
